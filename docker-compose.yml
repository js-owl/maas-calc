# Server deploy (dev + prod): image tag and registry set by GitLab CI sed + .env.
# Environment: DEV and PROD SERVERS — not for local machine.
# Usage on server: docker compose -f docker-compose.yml pull && docker compose -f docker-compose.yml up -d

services:
  backend-calc:
    image: ${NEXUS_PUSH_IMAGE:-nexus.maas.int.kronshtadt.ru:8443/maas-hosted/maas-prod-stl:latest}
    container_name: backend-calc
    ports:
      - "7000:7000"
    environment:
      - CORS_ORIGINS=["*"]
      - CORS_ALLOW_CREDENTIALS=true
      - CORS_ALLOW_METHODS=["*"]
      - CORS_ALLOW_HEADERS=["*"]
      - PYOPENGL_PLATFORM=osmesa
      - LIBGL_ALWAYS_SOFTWARE="1"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - maas-internal

networks:
  maas-internal:
    external: true

volumes:
  uploads:
  logs:
